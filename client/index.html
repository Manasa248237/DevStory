<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevStory | Personal Tech Blog</title>
    <meta name="description" content="A modern engineering journal exploring full-stack architecture, React patterns, Express REST APIs, and MongoDB Atlas database modeling." />
    
    <!-- Open Graph Default Meta -->
    <meta property="og:site_name" content="DevStory" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevStory | Personal Tech Blog" />
    <meta property="og:description" content="A modern engineering journal exploring full-stack architecture, React patterns, Express REST APIs, and MongoDB Atlas database modeling." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter / X Default Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevStory | Personal Tech Blog" />
    <meta name="twitter:description" content="A modern engineering journal exploring full-stack architecture, React patterns, Express REST APIs, and MongoDB Atlas database modeling." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-flash inline theme loader -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('devstory_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
